name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # Cloud CI builds and tests the platform-neutral projects only.
    # The WPF app and the screen-capture code need Windows and are built locally (PLAN §14).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Sts2Overlay.Core.Tests -c Release --logger "console;verbosity=normal"
      - run: dotnet build tools/RunHistoryAnalyzer -c Release
