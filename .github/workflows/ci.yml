name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # Platform-neutral projects: engine and save/log tracker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Sts2Overlay.Core.Tests -c Release --logger "console;verbosity=normal"
      - run: dotnet test tests/Sts2Overlay.GameState.Tests -c Release
      - run: dotnet build tools/RunHistoryAnalyzer -c Release

  windows:
    # Screen recognition (SkiaSharp native assets for Windows) and the WPF app.
    # Tests that need the locally extracted game art skip themselves here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Sts2Overlay.Vision.Tests -c Release
      - run: dotnet build src/Sts2Overlay.App -c Release
