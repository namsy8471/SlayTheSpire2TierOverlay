name: release

# v로 시작하는 태그(예: v0.1.0, v0.2.0-beta.1)를 push하면 테스트 → publish → Velopack 패키지 → GitHub Release 업로드.
# 보통은 레포 맨 위의 release.cmd(tools/release.ps1)로 태그를 만들어 push합니다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer without the leading v (e.g. 0.1.0). Tag v<version> is created on the selected commit.'
        required: true
        type: string
      dry_run:
        description: 'Pack only: skip the GitHub Release upload and attach the Releases folder as a workflow artifact.'
        required: false
        default: true
        type: boolean

permissions:
  contents: write   # Release와 태그를 만들려면 필요

# 같은 버전을 두 번 동시에 올리지 않도록
concurrency:
  group: release
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/namsy8471/SlayTheSpire2TierOverlay
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # 1단계 (Windows): 테스트하고 앱 폴더를 publish합니다. WPF 앱이라 빌드·테스트는 Windows에서만 됩니다.
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      skip: ${{ steps.version.outputs.skip }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 태그(또는 수동 입력)에서 버전을 꺼내 SemVer 2인지 확인합니다. 입력은 env로만 넘깁니다(스크립트 주입 방지).
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') { $raw = $env:INPUT_VERSION } else { $raw = $env:REF_NAME }
          $ver = $raw.Trim() -replace '^v', ''
          # SemVer 2: MAJOR.MINOR.PATCH[-prerelease] (build metadata '+...' is not used for releases)
          $semver = '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-(0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*)?$'
          if ($ver -notmatch $semver) {
            Write-Error "'$raw' is not a SemVer 2 version (expected e.g. v0.1.0 or v0.2.0-beta.1)."
            exit 1
          }
          $pre = $ver.Contains('-')
          Write-Host "Version: $ver (prerelease: $pre)"
          "version=$ver" >> $env:GITHUB_OUTPUT
          "prerelease=$($pre.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          # release.ps1 -Local은 vpk upload로 Release와 태그를 직접 만듭니다. 그 태그 push로 이 워크플로가
          # 다시 돌면 같은 버전을 또 올리려다 실패하므로, Release가 이미 있으면 나머지 단계를 건너뜁니다.
          gh release view "v$ver" --repo $env:GITHUB_REPOSITORY --json tagName 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::notice::Release v$ver already exists (uploaded with release.ps1 -Local?). Skipping."
            "skip=true" >> $env:GITHUB_OUTPUT
          }
          exit 0

      # ci.yml과 같은 테스트 프로젝트 (모두 Release)
      - name: Test
        if: steps.version.outputs.skip != 'true'
        run: |
          $projects = @(
            'tests/Sts2Overlay.Core.Tests',
            'tests/Sts2Overlay.GameState.Tests',
            'tests/Sts2Overlay.Resources.Tests',
            'tests/Sts2Overlay.Vision.Tests',
            'tests/Sts2Overlay.App.Tests'
          )
          foreach ($p in $projects) {
            dotnet test $p -c Release
            if ($LASTEXITCODE -ne 0) { Write-Error "Tests failed: $p"; exit 1 }
          }

      # 폴더 publish (single-file 아님: Velopack이 폴더를 패키지로 묶음).
      # --self-contained false: .NET을 앱에 넣지 않고 PC에 설치된 .NET 10 데스크톱 런타임을 씁니다(설치 크기 214 MB → 약 43 MB).
      # 런타임이 없는 PC는 아래 pack 단계의 --framework 덕분에 설치·업데이트 때 자동으로 설치됩니다.
      - name: Publish
        if: steps.version.outputs.skip != 'true'
        run: |
          dotnet publish src/Sts2Overlay.App -c Release -r win-x64 --self-contained false -o publish "-p:Version=${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload publish folder
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: publish/
          if-no-files-found: error
          retention-days: 3

  # 2단계 (Linux): 같은 폴더를 Windows용 Velopack 패키지로 묶고 올립니다 (vpk의 [win] 지시자 = cross-pack).
  # 왜 Linux인가: 델타는 vpk에 딸린 zstd가 만드는데, Windows 러너(영어, ANSI 코드 페이지 cp1252)에서는
  # 한글 제목에서 생긴 "STS2 티어 오버레이_ExecutionStub.exe" 경로가 "??"로 깨져 델타가 실패합니다 (v0.1.1).
  # Linux는 파일 이름을 UTF-8 바이트로 그대로 넘기므로 깨지지 않습니다. 제목(바로가기 이름)은 그대로 둡니다.
  pack:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
      # 수동 실행에서 dry_run을 켜면 GitHub Release에 올리지 않습니다. 태그 push에는 이 입력이 없어 항상 올립니다.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      # dotnet-tools.json(vpk 버전)과 아이콘, 그리고 태그 메시지(릴리스 노트)를 씁니다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 릴리스 노트: 주석 태그의 메시지(release.ps1이 노트로 씀) → 없으면 GitHub 자동 생성 노트 → 그래도 없으면 커밋 링크.
      # 빈 본문으로는 절대 올리지 않습니다. 결과는 release-notes.md (vpk pack --releaseNotes, GitHub Release 본문).
      - name: Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          $tag = "v$env:VERSION"
          $notes = ''
          $source = ''
          if ($env:EVENT_NAME -eq 'push') {
            # checkout이 태그를 가벼운 태그로 받아 오는 경우가 있어, 주석 태그 객체를 다시 받습니다.
            git fetch --force --no-tags origin "+refs/tags/${tag}:refs/tags/${tag}"
            $type = git for-each-ref "refs/tags/$tag" --format='%(objecttype)'
            if ($type -eq 'tag') {
              $raw = (git for-each-ref "refs/tags/$tag" --format='%(contents)') -join "`n"
              $raw = ($raw -split '-----BEGIN (PGP|SSH) SIGNATURE-----')[0]   # 서명된 태그면 서명 앞까지만
              $raw = $raw.Trim()
              # 예전 release.ps1의 한 줄짜리 기본 메시지는 노트가 아닙니다.
              if ($raw -and $raw -ne "STS2 티어 오버레이 $tag") { $notes = $raw; $source = 'tag annotation' }
            }
            else {
              Write-Host "::warning::$tag is a lightweight tag (no annotation). Falling back to generated notes."
            }
          }
          if (-not $notes) {
            $generated = gh api -X POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" `
              -f tag_name=$tag -f target_commitish=$env:SHA --jq .body 2>$null
            if ($LASTEXITCODE -eq 0 -and $generated) { $notes = ($generated -join "`n").Trim(); $source = 'generated' }
          }
          if (-not $notes) {
            $notes = "변경 내역: $env:REPO_URL/commits/$tag"
            $source = 'fallback'
          }
          [System.IO.File]::WriteAllText("$PWD/release-notes.md", $notes + "`n", (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "::notice::Release notes for ${tag}: $source"
          Get-Content release-notes.md

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: publish
          path: publish

      # 선택: 전투 추천 도우미. 이 워크플로는 도우미를 빌드하는 비공개 레포에 닿지 못하므로, 추적되는 advisor.lock.json
      # ({ "url", "sha256", "version" })이 있을 때만 그 zip을 받아 SHA-256을 확인하고(다르면 릴리스 실패) publish/advisor에 풉니다.
      # 파일이 없으면(기본) 한 줄 안내만 하고 넘어갑니다. 자세한 것은 docs/DISTRIBUTION.md "Combat advisor helper".
      - name: Combat advisor helper (optional, advisor.lock.json)
        run: |
          ./tools/advisor-package.ps1 -Destination publish/advisor -LockOnly
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Restore vpk (local dotnet tool)
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # 이전 릴리스를 받아 두면 vpk pack이 델타 업데이트 패키지를 만듭니다. 첫 릴리스면 받을 게 없으니 넘어갑니다.
      # Linux에서 돌므로 채널 기본값이 linux입니다. [win]만으로는 download의 채널이 바뀌지 않아 --channel win을 꼭 넘깁니다.
      - name: Download previous release (for deltas)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $extra = @()
          if ($env:PRERELEASE -eq 'true') { $extra += '--pre' }
          dotnet vpk '[win]' download github --repoUrl $env:REPO_URL --channel win --outputDir releases --token $env:GITHUB_TOKEN @extra
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::warning::No previous release downloaded (first release?). Packing without deltas.'
          }
          exit 0

      - name: Pack (Velopack, cross-pack for Windows)
        run: |
          $ver = $env:VERSION
          $pack = @('vpk', '[win]', 'pack', '--packId', 'namsy8471.Sts2Overlay', '--packVersion', $ver, '--packDir', 'publish',
            '--mainExe', 'Sts2Overlay.exe', '--packTitle', 'STS2 티어 오버레이', '--packAuthors', 'namsy8471',
            '--icon', 'src/Sts2Overlay.App/Assets/Sts2Overlay.ico', '--runtime', 'win-x64', '--channel', 'win',
            # 앱이 self-contained가 아니므로 꼭 필요합니다: 없으면 .NET이 없는 PC에서 설치는 되지만 실행이 안 됩니다.
            '--framework', 'net10.0-x64-desktop',
            '--releaseNotes', 'release-notes.md', '--outputDir', 'releases')
          dotnet @pack
          if ($LASTEXITCODE -ne 0) {
            # 안전망: 델타를 못 만들면 델타 없이 다시 묶습니다. 업데이트는 full 패키지로 받으므로 조금 더 받을 뿐 똑같이 됩니다.
            Write-Host '::warning::vpk pack failed (likely delta creation). Retrying with --delta none.'
            Get-ChildItem releases -File |
              Where-Object { $_.Name -like "*-$ver-*" -or $_.Name -like '*-Setup.exe' -or $_.Name -like '*-Portable.zip' } |
              Remove-Item -Force
            dotnet @pack --delta none
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Get-ChildItem releases | Format-Table Name, Length -AutoSize
          if (-not (Get-ChildItem releases -Filter "*-$ver-delta.nupkg")) {
            Write-Host "::warning::No delta package for $ver (first release, or the delta step failed)."
          }

      - name: Attach packages (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: releases-${{ env.VERSION }}
          path: |
            releases/
            release-notes.md
          retention-days: 7

      # 태그가 이미 있으면(push 트리거) 그 태그에, 수동 실행이면 이 커밋에 새 태그를 붙여 Release를 공개합니다.
      - name: Upload to GitHub Releases
        if: env.DRY_RUN != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = $env:VERSION
          $extra = @()
          if ($env:PRERELEASE -eq 'true') { $extra += '--pre' }
          dotnet vpk '[win]' upload github --repoUrl $env:REPO_URL --channel win --outputDir releases --publish `
            --tag "v$ver" --releaseName "STS2 티어 오버레이 v$ver" --targetCommitish '${{ github.sha }}' `
            --token $env:GITHUB_TOKEN @extra
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Released: $env:REPO_URL/releases/tag/v$ver"

      # vpk upload에는 본문 옵션이 없으므로, 공개된 Release의 본문을 노트로 채웁니다.
      - name: Set release notes
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v$env:VERSION" --repo $env:GITHUB_REPOSITORY --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $body = gh release view "v$env:VERSION" --repo $env:GITHUB_REPOSITORY --json body --jq .body
          if (-not ($body -join '').Trim()) { Write-Error "Release v$env:VERSION has an empty body."; exit 1 }
