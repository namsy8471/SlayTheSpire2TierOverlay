[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.6"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
ov-core = { path = "crates/ov-core" }
ov-gamestate = { path = "crates/ov-gamestate" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 0

[profile.dev]
debug = 0
