[package]
name = "ov-live"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The overlay's brain without UI: advisor helper process, decide requests and answers, offer lifecycle"
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
ov-vision = { path = "../ov-vision" }
ov-resources = { path = "../ov-resources" }
ov-core.workspace = true
ov-gamestate.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
