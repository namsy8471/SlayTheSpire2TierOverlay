<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="자동 업데이트: 앱이 GitHub Releases를 확인하고 백그라운드에서 내려받아 재시작 또는 종료 시 적용">
  <style>
    text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #EEF0F4; }
    .t { font-size: 17px; font-weight: 700; }
    .s { font-size: 13px; fill: #9AA3B2; }
    .l { font-size: 13px; fill: #C8CDD6; }
    .box { fill: #1F2330; stroke: #3A4152; stroke-width: 1.5; }
    .gh { fill: #18202B; stroke: #3498DB; stroke-width: 1.5; }
    .hl { fill: #2A2410; stroke: #F1C40F; stroke-width: 2; }
    .arrow { stroke: #9AA3B2; stroke-width: 2; fill: none; marker-end: url(#a); }
    .m { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 13px; fill: #9AA3B2; }
    .back { stroke: #3498DB; stroke-width: 2; fill: none; marker-end: url(#b); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#9AA3B2"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3498DB"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="400" rx="16" fill="#14161D"/>
  <text x="32" y="44" class="t" style="font-size:20px">자동 업데이트</text>
  <text x="168" y="44" class="s">설치판(Setup.exe)에서만 · 스스로 재시작하지 않습니다</text>

  <!-- GitHub -->
  <rect x="32" y="84" width="210" height="104" rx="10" class="gh"/>
  <text x="48" y="114" class="t">GitHub Releases</text>
  <text x="48" y="138" class="s">namsy8471/</text>
  <text x="48" y="156" class="s">SlayTheSpire2TierOverlay</text>
  <text x="48" y="176" class="s">새 버전 + 델타 패키지</text>

  <!-- app check -->
  <rect x="290" y="84" width="210" height="104" rx="10" class="box"/>
  <text x="306" y="114" class="t">앱이 확인</text>
  <text x="306" y="138" class="s">시작 약 15초 뒤 한 번</text>
  <text x="306" y="156" class="s">그 뒤 최대 6시간마다</text>
  <text x="306" y="176" class="s">트레이 "업데이트 확인"</text>

  <!-- download -->
  <rect x="548" y="84" width="210" height="104" rx="10" class="box"/>
  <text x="564" y="114" class="t">백그라운드 다운로드</text>
  <text x="564" y="138" class="s">바뀐 부분만 받는 델타</text>
  <text x="564" y="156" class="s">게임·오버레이는 그대로</text>
  <text x="564" y="176" class="s">실패해도 기록만 남김</text>

  <!-- arrows top row -->
  <path d="M290,120 L246,120" class="back"/>
  <path d="M246,152 L286,152" class="arrow"/>
  <path d="M500,136 L544,136" class="arrow"/>

  <!-- apply options -->
  <path d="M758,136 L800,136 L800,96 L820,96" class="arrow"/>
  <path d="M800,136 L800,176 L820,176" class="arrow"/>
  <rect x="824" y="68" width="148" height="56" rx="10" class="hl"/>
  <text x="836" y="92" class="l" style="font-weight:700;fill:#F1C40F">업데이트 적용</text>
  <text x="836" y="112" class="s" style="fill:#D8CFA8">(재시작) · 패널/트레이</text>
  <rect x="824" y="148" width="148" height="56" rx="10" class="box"/>
  <text x="836" y="172" class="l" style="font-weight:700">또는 종료할 때</text>
  <text x="836" y="192" class="s">조용히 적용</text>


  <!-- bottom notes -->
  <rect x="32" y="240" width="300" height="128" rx="10" class="box"/>
  <text x="48" y="270" class="t" style="font-size:15px">설정은 그대로</text>
  <text x="48" y="296" class="m">%LOCALAPPDATA%\Sts2Overlay</text>
  <text x="48" y="316" class="s">settings.json · app.log · decisions · local</text>
  <text x="48" y="336" class="s">업데이트·제거해도 남습니다</text>

  <rect x="350" y="240" width="300" height="128" rx="10" class="box"/>
  <text x="366" y="270" class="t" style="font-size:15px">끄거나 바꾸기</text>
  <text x="366" y="296" class="s">"autoUpdate": false → 자동 확인 끔</text>
  <text x="366" y="316" class="s">"updateUrl": 다른 저장소·폴더 (테스트용)</text>
  <text x="366" y="336" class="s">트레이에 현재 버전 표시</text>

  <rect x="668" y="240" width="300" height="128" rx="10" fill="#17251D" stroke="#2E7D4F" stroke-width="1.5"/>
  <text x="684" y="270" class="t" style="font-size:15px;fill:#7FD6A1">유일한 네트워크 통신</text>
  <text x="684" y="296" class="s" style="fill:#B9D9C5">GitHub에 새 버전이 있는지 묻는 것뿐</text>
  <text x="684" y="316" class="s" style="fill:#B9D9C5">익명 API 한도(시간당 60회)를</text>
  <text x="684" y="336" class="s" style="fill:#B9D9C5">아끼려고 6시간 간격</text>
</svg>
